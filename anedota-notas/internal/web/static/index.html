<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Anedota Notas</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <h1>Anedota Notas</h1>
        <span id="driver-badge" class="badge">Carregando...</span>
      </div>

      <div class="sidebar-actions">
        <button id="btn-new-note" class="btn primary">+ Nova Nota</button>
        <button id="btn-new-folder" class="btn">+ Pasta</button>
      </div>

      <div class="section-title">Pastas e Notas</div>
      <div id="tree-container" class="tree"></div>
    </aside>

    <main class="editor-pane">
      <div id="empty-state" class="empty-state">
        <h2>Nenhuma nota aberta</h2>
        <p>Selecione uma página na barra lateral ou crie uma nova anotação para começar.</p>
        <div class="empty-actions">
          <button id="btn-empty-new-note" class="btn primary">Criar primeira nota</button>
          <button id="btn-empty-new-folder" class="btn">Criar pasta</button>
        </div>
      </div>

      <div id="editor-wrapper" class="editor-wrapper hidden">
        <header class="editor-header">
          <div class="note-meta">
            <span id="current-note-path" class="note-path"></span>
            <span id="unsaved-pill" class="pill warning hidden">Não salvo</span>
          </div>
          <div class="editor-actions">
            <button id="btn-save" class="btn primary" title="Salvar (Ctrl/Cmd+S)">Salvar</button>
            <button id="btn-save-as" class="btn" title="Salvar cópia em outro ficheiro ou pasta">Salvar como...</button>
            <button id="btn-rename" class="btn" title="Renomear ou mover ficheiro">Renomear</button>
            <button id="btn-delete-note" class="btn danger">Excluir</button>
          </div>
        </header>

        <textarea id="note-editor" spellcheck="true" placeholder="Escreva sua anotação aqui..."></textarea>

        <footer class="editor-footer">
          <span id="editor-stats">0 caracteres · 1 linha</span>
          <span id="editor-saved-at"></span>
        </footer>
      </div>
    </main>

    <aside class="version-pane">
      <div class="version-header">
        <h2>Versionamento</h2>
        <span id="repo-dirty-pill" class="pill">Limpo</span>
      </div>

      <section class="commit-box">
        <label for="commit-message">Novo commit (snapshot das notas)</label>
        <input id="commit-message" type="text" placeholder="Ex: Adiciona resumo da aula 2" />
        <button id="btn-commit" class="btn primary full">Criar Commit</button>
      </section>

      <section class="changes-box">
        <div class="section-title">Alterações pendentes</div>
        <ul id="changes-list" class="changes-list"></ul>
      </section>

      <section class="history-box">
        <div class="section-title">Histórico de Commits</div>
        <div id="commits-list" class="commits-list"></div>
      </section>
    </aside>
  </div>

  <div id="toast" class="toast hidden"></div>
  <script src="/app.js"></script>
</body>
</html>
